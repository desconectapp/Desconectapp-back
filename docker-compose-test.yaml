services:
  test-db:
    image: postgres:16.4-alpine3.20
    ports:
      - "5435:5432"
    env_file:
      - .env_test
    volumes:
      - ./database_test/postgres:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./src/db/files/activities.csv:/activities.csv
      - ./src/db/files/users.csv:/users.csv
      - ./src/db/files/activity_requests.csv:/activity_requests.csv
      - ./src/db/files/users_preference.csv:/users_preference.csv
      - ./src/db/files/profiles.csv:/profiles.csv

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8083:8083"
    volumes:
      - ./src:/app
    working_dir: /app
    environment:
      PORT: "8080"
      GIN_MODE: test
    env_file:
      - .env_test
    depends_on:
      - test-db
    command: go test ./... -v