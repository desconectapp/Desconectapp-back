services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: hot-reloading-gin
    ports:
      - "8080:8080" 
    volumes:
      - ./src:/app
    environment:
      PORT: "8080"
    env_file:
      - .env
    command: go run main.go

  postgres:
    image: postgres:16.4-alpine3.20
    ports:
      - 5432:5432
    env_file:
      - .env
    volumes:
      - ./database/postgres:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./src/db/files/activities.csv:/activities.csv
      - ./src/db/files/users.csv:/users.csv
      - ./src/db/files/activity_requests.csv:/activity_requests.csv
      - ./src/db/files/users_preference.csv:/users_preference.csv
      - ./src/db/files/profiles.csv:/profiles.csv

  pgadmin:
    image: dpage/pgadmin4:7.5
    container_name: desconectapp_pg_admin
    restart: always
    env_file:
      - .env
    ports:
      - "5050:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin

volumes:
  pgadmindata:
