version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "./db/sqlc/users.sql"
      - "./db/sqlc/preferences.sql"
      - "./db/sqlc/groups.sql"
      - "./db/sqlc/activities.sql"
      - "./db/sqlc/partial_match.sql"
      - "./db/sqlc/admin.sql"
    schema: "./db/init.sql"
    gen:
      go:
        package: "repository"
        out: "./db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
